<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam Brands — Coming Soon</title>
<link rel="icon" href="/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{ --yellow:#FFCC00; --dark-text:#1a1400; --gray:#9296a0; --card:#16161a; --border:#2a2a32; }
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Roboto',Arial,sans-serif;color:#f3f3f3;
  background:#000;min-height:100vh;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
}

/* animated glow orbs in the background */
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:0;pointer-events:none;}
.orb1{width:480px;height:480px;background:rgba(255,204,0,0.18);top:-120px;left:-100px;animation:float1 14s ease-in-out infinite;}
.orb2{width:400px;height:400px;background:rgba(255,204,0,0.10);bottom:-120px;right:-80px;animation:float2 18s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0);}50%{transform:translate(60px,50px);}}
@keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,-40px);}}

/* subtle grid overlay */
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
  background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(circle at center,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(circle at center,#000 30%,transparent 75%);}

.cs-wrap{position:relative;z-index:1;max-width:660px;animation:cs-in 1s ease forwards;opacity:0;transform:translateY(20px);}
@keyframes cs-in{to{opacity:1;transform:translateY(0);}}

.cs-logo{width:88px;height:88px;margin:0 auto 34px;animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,204,0,0));}50%{transform:scale(1.05);filter:drop-shadow(0 0 25px rgba(255,204,0,0.4));}}

.cs-pill{display:inline-block;background:rgba(255,204,0,0.12);color:var(--yellow);
  font-size:13px;font-weight:700;letter-spacing:2px;padding:8px 20px;border-radius:22px;margin-bottom:26px;
  border:1px solid rgba(255,204,0,0.3);}
.cs-wrap h1{font-size:clamp(2.4rem,8vw,4.6rem);font-weight:900;line-height:1.05;margin-bottom:22px;letter-spacing:-1px;}
.cs-wrap h1 .yellow{color:var(--yellow);}
.cs-sub{color:var(--gray);font-size:clamp(1.05rem,2.5vw,1.35rem);line-height:1.6;max-width:520px;margin:0 auto 40px;}

/* animated dots */
.cs-dots{display:flex;gap:10px;justify-content:center;margin-bottom:44px;}
.cs-dots span{width:11px;height:11px;border-radius:50%;background:var(--yellow);opacity:.35;animation:blink 1.4s infinite ease-in-out both;}
.cs-dots span:nth-child(1){animation-delay:-.32s;}
.cs-dots span:nth-child(2){animation-delay:-.16s;}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8);}40%{opacity:1;transform:scale(1.15);}}

.cs-socials{display:flex;gap:14px;justify-content:center;}
.cs-socials a{width:46px;height:46px;border-radius:50%;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:#f3f3f3;
  transition:transform .25s, border-color .25s, color .25s, box-shadow .25s;}
.cs-socials a:hover{transform:translateY(-4px);border-color:var(--yellow);color:var(--yellow);
  box-shadow:0 0 25px rgba(255,204,0,0.25);}
.cs-socials svg{width:20px;height:20px;}

.cs-foot{position:fixed;bottom:22px;left:0;right:0;z-index:1;color:#5a5d66;font-size:12.5px;}
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="grid-bg"></div>

<div class="cs-wrap">
  <svg class="cs-logo" viewBox="0 0 100 100" fill="none">
    <circle cx="50" cy="50" r="44" stroke="#FFCC00" stroke-width="7"/>
    <circle cx="50" cy="50" r="16" fill="#FFCC00"/>
  </svg>

  <span class="cs-pill">SOMETHING BIG IS COMING</span>
  <h1>We're Building<br>Something <span class="yellow">Remarkable.</span></h1>
  <p class="cs-sub">Sam Brands is putting the finishing touches on something worth the wait. Stay tuned — it's almost here.</p>

  <div class="cs-dots"><span></span><span></span><span></span></div>
