<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam Brands — Coming Soon</title>

  <!-- Favicon -->
  <link rel="icon" href="/images/favicon.png">

  <!-- Roboto font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       BRAND COLORS
       ============================================================ */
    :root {
      --yellow: #FFCC00;
      --dark-text: #1a1400;
      --gray: #9296a0;
      --card: #16161a;
      --border: #2a2a32;
    }

    /* ============================================================
       BASE / RESET
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      color: #f3f3f3;
      background: #000;
      min-height: 100vh;
      overflow: hidden;                 /* stops the glow orbs causing scrollbars */
      position: relative;

      /* center everything on the screen */
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }


    /* ============================================================
       BACKGROUND DECORATION
       Two soft glowing "orbs" that slowly drift around,
       plus a faint grid. Purely decorative.
       ============================================================ */

    /* the glowing blobs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);               /* the blur is what makes them glow */
      opacity: 0.5;
      z-index: 0;                        /* sit behind the text */
      pointer-events: none;             /* can't be clicked */
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      background: rgba(255, 204, 0, 0.18);
      top: -120px;
      left: -100px;
      animation: drift-1 14s ease-in-out infinite;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(255, 204, 0, 0.10);
      bottom: -120px;
      right: -80px;
      animation: drift-2 18s ease-in-out infinite;
    }

    /* the two orbs float back and forth */
    @keyframes drift-1 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(60px, 50px); }
    }
    @keyframes drift-2 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-50px, -40px); }
    }

    /* faint grid lines, fading out toward the edges */
    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 52px 52px;
      /* fade the grid out in a circle around the center */
      mask-image: radial-gradient(circle at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 75%);
    }


    /* ============================================================
       MAIN CONTENT (logo, text, dots, socials)
       ============================================================ */

    /* the whole content block fades up when the page loads */
    .content {
      position: relative;
      z-index: 1;                       /* sit above the background */
      max-width: 660px;
      opacity: 0;
      transform: translateY(20px);
      animation: fade-up 1s ease forwards;
    }

    @keyframes fade-up {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* the logo, with a gentle pulsing glow */
    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 34px;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 0 rgba(255, 204, 0, 0));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 25px rgba(255, 204, 0, 0.4));
      }
    }

    /* the small "SOMETHING BIG IS COMING" pill */
    .pill {
      display: inline-block;
      background: rgba(255, 204, 0, 0.12);
      border: 1px solid rgba(255, 204, 0, 0.3);
      color: var(--yellow);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 8px 20px;
      border-radius: 22px;
      margin-bottom: 26px;
    }

    /* the big headline */
    .headline {
      font-size: clamp(2.4rem, 8vw, 4.6rem);   /* grows/shrinks with screen size */
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 22px;
    }

    /* makes the word "Remarkable." yellow */
    .headline .yellow {
      color: var(--yellow);
    }

    /* the paragraph under the headline */
    .subtext {
      color: var(--gray);
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      line-height: 1.6;
      max-width: 520px;
      margin: 0 auto 40px;
    }


    /* ============================================================
       BLINKING DOTS
       Three yellow dots that blink in sequence.
       ============================================================ */
    .dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 44px;
    }

    .dots span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--yellow);
      opacity: 0.35;
      animation: blink 1.4s infinite ease-in-out both;
    }

    /* stagger the start time so they blink one after another */
    .dots span:nth-child(1) { animation-delay: -0.32s; }
    .dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40%           { opacity: 1;    transform: scale(1.15); }
    }


    /* ============================================================
       SOCIAL ICONS
       ============================================================ */
    .socials {
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    .socials a {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--border);
      color: #f3f3f3;

      /* center the icon inside the circle */
      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform 0.25s, border-color 0.25s, color 0.25s, box-shadow 0.25s;
    }

    /* lift + glow yellow on hover */
    .socials a:hover {
      transform: translateY(-4px);
      border-color: var(--yellow);
      color: var(--yellow);
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.25);
    }

    .socials svg {
      width: 20px;
      height: 20px;
    }


    /* ============================================================
       FOOTER (copyright pinned to the bottom)
       ============================================================ */
    .copyright {
      position: fixed;
      bottom: 22px;
      left: 0;
      right: 0;
      z-index: 1;
      color: #5a5d66;
      font-size: 12.5px;
    }
  </style>
</head>

<body>

  <!-- Background decoration -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="grid-bg"></div>

  <!-- Main content -->
  <div class="content">

    <!-- Logo (swap the src for your real logo file) -->
    <img class="logo" src="/images/logo.png" alt="Sam Brands logo">

    <!-- Small label -->
    <span class="pill">SOMETHING BIG IS COMING</span>

    <!-- Headline -->
    <h1 class="headline">
      We're Building<br>
      Something <span class="yellow">Remarkable.</span>
    </h1>

    <!-- Subtext -->
    <p class="subtext">
      Sam Brands is putting the finishing touches on something worth the wait.
      Stay tuned — it's almost here.
    </p>

    <!-- Blinking dots -->
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Social links -->
    <div class="socials">

      <!-- Instagram -->
      <a href="https://www.instagram.com/sambrandsco" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>

      <!-- YouTube -->
      <a href="https://www.youtube.com/@sambrandsco" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M23 12s0-3.3-.4-4.9a2.5 2.5 0 0 0-1.8-1.8C19.2 5 12 5 12 5s-7.2 0-8.8.4A2.5 2.5 0 0 0 1.4 7.2C1 8.7 1 12 1 12s0 3.3.4 4.9a2.5 2.5 0 0 0 1.8 1.8C4.8 19 12 19 12 19s7.2 0 8.8-.4a2.5 2.5 0 0 0 1.8-1.8C23 15.3 23 12 23 12zM9.8 15.3V8.7l5.7 3.3z"/>
        </svg>
      </a>

      <!-- TikTok -->
      <a href="https://www.tiktok.com/@sambrandsco" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 8.2a6.9 6.9 0 0 0 4 1.3V6.7a4 4 0 0 1-2.6-1.2A4 4 0 0 1 16.2 3h-2.9v11.4a2.3 2.3 0 1 1-2-2.3v-2.9a5.2 5.2 0 1 0 4.7 5.2V8.2z"/>
        </svg>
      </a>

      <!-- X (Twitter) -->
      <a href="https://twitter.com/sambrandsco" target="_blank" rel="noopener" aria-label="X">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.9 2h3.3l-7.2 8.2L23.5 22h-6.6l-5.2-6.8L5.8 22H2.5l7.7-8.8L1.5 2h6.8l4.7 6.2zm-1.2 18h1.8L7.3 3.8H5.4z"/>
        </svg>
      </a>

    </div>
  </div>

  <!-- Copyright -->
  <div class="copyright">
    &copy; 2026 Sam Brands, LLC. All rights reserved.
  </div>

</body>
</html>
